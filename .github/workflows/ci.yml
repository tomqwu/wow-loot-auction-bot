name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails the build if coverage drops below the thresholds in
      # vitest.config.ts (99% lines/statements/functions, 96% branches).
      - run: npm run test:coverage
